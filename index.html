<style>

</style><link rel="manifest" href="./manifest.json">

</head><body><main class="app"><header class="hero"><h1>Convertisseur étiquette</h1></header><section class="card">

<div class="topline"><span id="count">Aucun PDF importé</span><button class="clear" id="clear" type="button">Tout supprimer</button></div><div class="list" id="list"><div class="empty">Les PDF importés apparaîtront ici avec leur miniature.</div></div>

</section></main><script>
"use strict";pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const MODES={chronopost:{label:"Chronopost",pw:297,ph:210,x:179.5,y:31.5,w:112.5,h:146.3,r:0},vintedEtranger:{label:"Vinted étranger",pw:210,ph:297,x:0,y:0,w:98,h:103,r:90},mondialRelay:{label:"Mondial Relay",pw:210,ph:297,x:28.8,y:183.4,w:152.4,h:102.3,r:270},vintedFrance:{label:"Vinted France",pw:210,ph:297,x:4,y:3.2,w:98,h:141.4,r:0}};
const $=id=>document.getElementById(id),input=$("files"),drop=$("drop"),list=$("list"),count=$("count"),clear=$("clear"),zipBtn=$("zipBtn"),pdfBtn=$("pdfBtn"),progress=$("progress"),bar=$("bar"),status=$("status");let items=[],id=0,busy=false;

function opts(){return '<option value="">Sélectionner un mode obligatoire</option>'+Object.entries(MODES).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join("")}
function state(mark=false){count.textContent=items.length?items.length+" PDF"+(items.length>1?"s":"")+" importé"+(items.length>1?"s":""):"Aucun PDF importé";clear.classList.toggle("on",!!items.length);const ready=items.length&&items.every(x=>x.mode&&x.ready&&!x.error)&&!busy;zipBtn.disabled=pdfBtn.disabled=!ready;items.forEach(x=>document.querySelector(`[data-sel="${x.id}"]`)?.classList.toggle("miss",mark&&!x.mode));if(!items.length)msg("Importez un ou plusieurs PDF.");else if(items.some(x=>!x.mode))msg("Choisissez un mode de rognage pour chaque PDF.");else if(items.some(x=>!x.ready))msg("Génération des miniatures...");else if(!busy)msg("Tous les PDF sont prêts.")}

function remove(i){items=items.filter(x=>x.id!==i);document.querySelector(`[data-row="${i}"]`)?.remove();if(!items.length)list.innerHTML='<div class="empty">Les PDF importés apparaîtront ici avec leur miniature.</div>';state()}
input.onchange=()=>add(input.files);["dragenter","dragover"].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add("drag")}));["dragleave","drop"].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove("drag")}));drop.addEventListener("drop",e=>add(e.dataTransfer.files));clear.onclick=()=>{items=[];list.innerHTML='<div class="empty">Les PDF importés apparaîtront ici avec leur miniature.</div>';progress.classList.remove("on");state()};

g.cleanup()}}finally{if(p)await p.destroy()}}if(type==="zip"){msg("Création du ZIP...");const z=await zip.generateAsync({type:"blob",compression:"DEFLATE"},x=>bar.style.width=90+Math.round(x.percent/10)+"%");dl(z,"Etiquettes_JPG.zip")}else{msg("Création du PDF 10 × 15 cm...");pdfOut.save("Etiquettes_10x15cm.pdf")}bar.style.width="100%";msg(`${total} étiquette${total>1?"s":""} générée${total>1?"s":""}.`,"ok")}catch(e){console.error(e);bar.style.width="0%";msg(e.message||"Erreur de conversion","err")}finally{busy=false;state()}}
